<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canal Metropol - Radio en Directo</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Paleta corporativa monocromática */
      --bg-dark: #000000;
      --card-bg: #151515;
      --accent-cyan: #d4d4d4;
      --accent-magenta: #8a8a8a;
      --text-main: #ffffff;
      --text-muted: #737373;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at top right, rgba(255, 255, 255, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(138, 138, 138, 0.05), transparent 40%);
    }

    .player-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      padding: 40px 30px;
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 255, 255, 0.03) inset;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(138, 138, 138, 0.1);
      color: var(--accent-magenta);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 8px 16px;
      border-radius: 30px;
      text-transform: uppercase;
      margin-bottom: 28px;
      border: 1px solid rgba(138, 138, 138, 0.2);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-magenta);
      border-radius: 50%;
      animation: pulse 1.5s infinite ease-in-out;
      box-shadow: 0 0 8px var(--accent-magenta);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    .station-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffffff 20%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .station-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 35px;
      font-weight: 600;
    }

    .visualizer-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 50px;
      margin-bottom: 40px;
    }

    .bar {
      width: 6px;
      height: 8px;
      background: var(--accent-cyan);
      border-radius: 6px;
      transition: height 0.2s ease, box-shadow 0.2s ease;
    }

    .playing .bar {
      animation: bounce 1.2s infinite ease-in-out alternate;
      box-shadow: 0 0 10px rgba(212, 212, 212, 0.4);
    }

    .playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .bar:nth-child(2) { animation-delay: 0.4s; animation-duration: 0.9s; }
    .playing .bar:nth-child(3) { animation-delay: 0.2s; animation-duration: 1.1s; }
    .playing .bar:nth-child(4) { animation-delay: 0.5s; animation-duration: 0.8s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; animation-duration: 1.0s; }

    @keyframes bounce {
      0% { height: 8px; }
      100% { height: 45px; }
    }

    .controls-wrapper { display: flex; flex-direction: column; align-items: center; }

    /* Nuevo contenedor para agrupar Play y Stop */
    .main-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .play-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), #333333);
      color: #111;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(212, 212, 212, 0.2), inset 0 2px 4px rgba(255,255,255,0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .play-btn:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 15px 35px rgba(212, 212, 212, 0.3), inset 0 2px 4px rgba(255,255,255,0.6);
    }

    .play-btn:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(212, 212, 212, 0.15);
    }

    .play-btn svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
      margin-left: 4px;
      transition: margin 0.2s;
    }
    
    .play-btn.is-playing svg { margin-left: 0; }

    /* Estilos para el nuevo botón de Stop */
    .stop-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 1px solid rgba(138, 138, 138, 0.3);
      background: rgba(138, 138, 138, 0.1);
      color: var(--accent-magenta);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    .stop-btn:hover {
      background: rgba(138, 138, 138, 0.2);
      transform: scale(1.05);
      color: var(--text-main);
    }

    .stop-btn:active {
      transform: scale(0.95);
    }

    .stop-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 15px;
      justify-content: center;
      width: 100%;
      padding: 0 20px;
    }

    .volume-icon { width: 20px; height: 20px; fill: var(--text-muted); flex-shrink: 0; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      background: #333333; border-radius: 6px; outline: none; cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent-cyan); cursor: pointer;
      box-shadow: 0 0 10px rgba(212, 212, 212, 0.4); transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .error-msg {
      display: none; color: var(--accent-magenta); font-size: 0.85rem; margin-top: 20px;
      background: rgba(138, 138, 138, 0.1); padding: 10px; border-radius: 8px;
      border: 1px solid rgba(138, 138, 138, 0.2); animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="live-badge"><span class="pulse-dot"></span> EN DIRECTO</div>
    <h1 class="station-title">CANAL METROPOL</h1>
    <p class="station-subtitle">Tu música, tu estación</p>

    <div class="visualizer-container" id="visualizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="controls-wrapper">
      
      <!-- Controles Principales agrupados -->
      <div class="main-controls">
        <button class="play-btn" id="playBtn" aria-label="Reproducir o Pausar">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <!-- Nuevo botón Stop -->
        <button class="stop-btn" id="stopBtn" aria-label="Detener">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>

      <div class="volume-container">
        <svg class="volume-icon" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="Control de volumen">
      </div>
    </div>
    
    <div id="errorMsg" class="error-msg">No se pudo conectar con la emisora. Inténtalo más tarde.</div>

    <!-- Se elimina el src inicial para que no cargue datos hasta darle a Play -->
    <audio id="audioPlayer" preload="none"></audio>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById('audioPlayer');
      const playBtn = document.getElementById('playBtn');
      const stopBtn = document.getElementById('stopBtn');
      const playIcon = document.getElementById('playIcon');
      const visualizer = document.getElementById('visualizer');
      const volumeSlider = document.getElementById('volumeSlider');
      const errorMsg = document.getElementById('errorMsg');

      // Guardamos la URL del streaming en una variable
      const streamUrl = "https://radioserver11.profesionalhosting.com/proxy/pkg78607?mp=/stream&1789928998114";

      const svgPlay = '<path d="M8 5v14l11-7z"/>';
      const svgPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

      audio.volume = volumeSlider.value;

      function setUIPlaying() {
        playIcon.innerHTML = svgPause;
        visualizer.classList.add('playing');
        playBtn.classList.add('is-playing');
      }

      function setUIPaused() {
        playIcon.innerHTML = svgPlay;
        visualizer.classList.remove('playing');
        playBtn.classList.remove('is-playing');
      }

      // Nueva función para detener por completo
      function stopAudio() {
        audio.pause();
        audio.removeAttribute('src'); // Elimina la fuente para frenar la descarga de datos
        audio.load();                 // Resetea el elemento de audio
        setUIPaused();
      }

      function setupMediaSession() {
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Canal Metropol',
            artist: 'Radio en Directo',
            album: 'Tu música, tu estación',
            artwork: [
              { src: 'https://canalmetropol.com/wp-content/uploads/2021/08/logo-metropol.jpg', sizes: '96x96', type: 'image/jpeg' },
              { src: 'https://canalmetropol.com/wp-content/uploads/2021/08/logo-metropol.jpg', sizes: '512x512', type: 'image/jpeg' }
            ]
          });

          navigator.mediaSession.setActionHandler('play', () => {
            playBtn.click(); // Reutiliza la lógica del botón
          });

          navigator.mediaSession.setActionHandler('pause', () => {
            playBtn.click();
          });
          
          navigator.mediaSession.setActionHandler('stop', () => {
            stopAudio();
          });
        }
      }

      playBtn.addEventListener('click', () => {
        errorMsg.style.display = 'none';

        // Verificamos si está pausado o si la URL ha sido eliminada (por el botón Stop)
        if (audio.paused || !audio.src) {
          // Si no tiene fuente (inicio o tras darle a Stop), se la asignamos
          if (!audio.getAttribute('src')) {
            audio.setAttribute('src', streamUrl);
            audio.load();
          }

          const playPromise = audio.play();
          
          if (playPromise !== undefined) {
            playPromise.then(() => {
              setUIPlaying();
              setupMediaSession();
            }).catch(error => {
              console.error("Error en la reproducción:", error);
              showError();
            });
          }
        } else {
          audio.pause();
          setUIPaused();
        }
      });

      // Evento para el botón de Stop
      stopBtn.addEventListener('click', stopAudio);

      volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
      audio.addEventListener('error', () => { showError(); });
      
      function showError() {
        errorMsg.style.display = 'block';
        setUIPaused();
      }
    });
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
